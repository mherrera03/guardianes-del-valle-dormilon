<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Guardianes del Valle Dormilón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#26235A; --noche2:#3B3880;
  --musgo:#6CC07A; --musgo2:#3E9A5C;
  --farol:#FFC94D; --farol2:#DE8F17;
  --lumi:#5EC6FF; --petalo:#FF8FB1;
  --papel:#FFF4DE; --papel2:#E6CFA3;
  --tinta:#2E2A4F;
  --display:'Sniglet','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  /* Escenario fijo de 1280x720 que se escala para caber en cualquier pantalla; mundo de papel recortado al anochecer */
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--noche);
  background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.08) 0 1px,transparent 2px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.06) 0 1px,transparent 2px);
  background-size:120px 120px,170px 170px;
  font-family:var(--body);color:var(--tinta);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit}
#stage{
  position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:center center;transform:translate(-50%,-50%);
  overflow:hidden;border-radius:26px;background:#9fd8ff;
  box-shadow:0 24px 70px rgba(0,0,0,.5);touch-action:none;
}
.screen{position:absolute;inset:0;animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.abs{position:absolute}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grain{position:absolute;inset:0;pointer-events:none;z-index:200;opacity:.16;mix-blend-mode:overlay;background-size:256px 256px}

/* Botones */
.btn{
  font-family:var(--display);font-weight:800;font-size:38px;line-height:1;letter-spacing:.5px;
  color:var(--tinta);background:var(--farol);border:none;border-radius:999px;
  padding:18px 46px 22px;display:inline-flex;align-items:center;gap:14px;cursor:pointer;
  box-shadow:0 9px 0 var(--farol2),0 16px 26px rgba(20,10,60,.3);
  transition:transform .12s,box-shadow .12s;
}
.btn svg{width:40px;height:40px}
.btn:active{transform:translateY(7px);box-shadow:0 2px 0 var(--farol2),0 6px 12px rgba(20,10,60,.3)}
.btn.verde{background:var(--musgo);box-shadow:0 9px 0 var(--musgo2),0 16px 26px rgba(20,10,60,.3)}
.btn.verde:active{box-shadow:0 2px 0 var(--musgo2)}
.btn.papel{background:var(--papel);box-shadow:0 9px 0 var(--papel2),0 16px 26px rgba(20,10,60,.3)}
.btn.papel:active{box-shadow:0 2px 0 var(--papel2)}
.btn.sm{font-size:28px;padding:14px 30px 17px}
.btn.sm svg{width:32px;height:32px}
.btn:focus-visible,.ibtn:focus-visible,.node:focus-visible{outline:5px solid #fff;outline-offset:5px}
.ibtn{
  width:86px;height:86px;border-radius:50%;border:none;background:var(--papel);cursor:pointer;
  display:grid;place-items:center;box-shadow:0 7px 0 var(--papel2),0 12px 20px rgba(20,10,60,.28);
  transition:transform .12s,box-shadow .12s;padding:0;
}
.ibtn svg{width:50px;height:50px}
.ibtn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--papel2)}
.ibtn.off{opacity:.55}
.label-under{font-family:var(--display);font-size:20px;color:#fff;text-align:center;margin-top:10px;-webkit-text-stroke:5px var(--noche);paint-order:stroke fill}

/* Narrador: Don Plumas */
#narr{position:absolute;left:6px;bottom:4px;z-index:80;display:flex;align-items:flex-end;pointer-events:none}
#narr .owl{width:138px;height:152px;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
#narr .bubble{
  background:var(--papel);border-radius:30px;padding:16px 26px 18px;font-size:29px;font-weight:600;line-height:1.18;
  max-width:600px;margin:0 0 88px 2px;position:relative;box-shadow:0 7px 0 rgba(46,42,79,.18),0 14px 30px rgba(0,0,0,.18);
  transition:opacity .25s,transform .25s;transform-origin:left bottom;text-wrap:balance;
}
#narr .bubble:before{content:"";position:absolute;left:-16px;bottom:22px;border:14px solid transparent;border-right:22px solid var(--papel);border-left:0}
#narr.quiet .bubble{opacity:0;transform:scale(.85)}
#narr.gone{display:none}
.owl .beak-low{transform-box:fill-box;transform-origin:50% 0}
.talking .owl .beak-low,.owl.talking .beak-low{animation:beak .2s ease-in-out infinite alternate}
@keyframes beak{to{transform:translateY(7px) scaleY(1.15)}}
.owl .wing-r{transform-box:fill-box;transform-origin:20% 10%}
.talking .owl .wing-r,.owl.talking .wing-r{animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{to{transform:rotate(-22deg)}}
.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}

/* Lumi */
.lumi{overflow:visible;filter:drop-shadow(0 0 16px var(--lc))}
.lumi .lumi-fill{fill:var(--lc);transition:fill .7s}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.hop{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(6px) scale(1.1,.9)}50%{transform:translateY(-70px) scale(.95,1.05)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.wiggle{animation:wiggle .45s}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.zzz{position:absolute;font-family:var(--display);font-weight:800;color:#fff;font-size:40px;text-shadow:0 3px 0 rgba(0,0,0,.25);animation:zzz 3s ease-out infinite;pointer-events:none}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(50px,-110px) scale(1.3)}}

/* Arrastrables */
.drag{touch-action:none;cursor:grab}
.dragging{cursor:grabbing;z-index:90!important;filter:drop-shadow(0 14px 10px rgba(0,0,0,.3))}
.dragging>*{transform:scale(1.12)}
.returning{transition:left .3s cubic-bezier(.3,1.4,.5,1),top .3s cubic-bezier(.3,1.4,.5,1)}

/* HUD de nivel */
.hud{position:absolute;left:0;right:0;top:0;height:110px;display:flex;align-items:center;gap:16px;padding:14px 18px;z-index:70;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{
  font-family:var(--display);font-size:26px;background:var(--papel);border-radius:999px;padding:10px 22px 12px;
  box-shadow:0 5px 0 var(--papel2);display:inline-flex;align-items:center;gap:10px;white-space:nowrap
}
.chip svg{width:30px;height:30px}
.chip.derecho{background:var(--petalo);box-shadow:0 5px 0 #D9658C;color:#fff}
.hud .grow{flex:1}
.meter{display:flex;align-items:center;gap:10px;background:rgba(255,244,222,.96);border-radius:999px;padding:8px 18px 8px 10px;box-shadow:0 5px 0 var(--papel2)}
.meter .mi{width:44px;height:44px;display:grid;place-items:center}
.meter .mi svg{width:100%;height:100%}
.meter .segs{display:flex;gap:5px;width:230px;height:28px}
.meter .segs b{flex:1;border-radius:9px;background:#E3D3B4;transition:background .3s,transform .3s}
.meter .segs b.on{background:var(--musgo);transform:scaleY(1.12)}
.meter.blue .segs b.on{background:#7A6CFF}
.hud .chip{font-size:21px;padding:9px 18px 11px}
.hud .meter .segs{width:200px}

/* Modales */
.modal{position:absolute;inset:0;z-index:75;display:grid;place-items:center;background:rgba(30,25,80,.55);animation:fadeIn .25s both}
.card{
  background:var(--papel);border-radius:40px;padding:34px 44px;box-shadow:0 12px 0 var(--papel2),0 30px 60px rgba(0,0,0,.35);
  text-align:center;animation:popIn .45s cubic-bezier(.3,1.5,.5,1) both;max-width:1000px
}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-family:var(--display);font-weight:800;font-size:60px;margin:0 0 8px;line-height:1.05;text-wrap:balance}
.card p{font-size:28px;margin:6px 0;line-height:1.25;text-wrap:balance}
.row{display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap}
.stars3{display:flex;gap:14px;justify-content:center;margin:6px 0 12px}
.stars3 svg{width:96px;height:96px}
.stars3 .s{opacity:.2;transform:scale(.7);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.stars3 .s.on{opacity:1;transform:scale(1)}
.reward{background:#fff;border-radius:26px;padding:12px 18px 14px;width:250px;box-shadow:0 6px 0 #EADBC0}
.reward .pic{height:130px;display:grid;place-items:center}
.reward .pic svg{max-height:130px;max-width:200px}
.reward b{font-family:var(--display);font-size:22px;display:block}
.reward span{font-size:20px}
.lesson{font-family:var(--display);font-size:32px;color:#C2416E;margin:14px 0 18px}

/* Partículas */
.spark{position:absolute;width:26px;height:26px;pointer-events:none;z-index:95;animation:spark .8s ease-out forwards}
.spark svg{width:100%;height:100%}
@keyframes spark{from{transform:translate(0,0) scale(1) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(160deg);opacity:0}}
.ftext{position:absolute;font-family:var(--display);font-weight:800;font-size:44px;color:#fff;pointer-events:none;z-index:96;
  -webkit-text-stroke:8px var(--tinta);paint-order:stroke fill;animation:ftext 1.1s ease-out forwards;white-space:nowrap}
@keyframes ftext{0%{transform:translate(-50%,0) scale(.5);opacity:0}20%{transform:translate(-50%,-20px) scale(1.1);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}

/* Mapa */
.node{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:none;padding:0;cursor:pointer;
  background:var(--papel);box-shadow:0 9px 0 var(--papel2),0 18px 30px rgba(20,10,60,.35);display:grid;place-items:center;transition:transform .15s}
.node:active{transform:translateY(6px)}
.node .ico{width:96px;height:96px}
.node .num{position:absolute;top:-10px;left:-6px;width:48px;height:48px;border-radius:50%;background:var(--noche2);color:#fff;
  font-family:var(--display);font-size:28px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.node.locked{background:#CFC8DA;box-shadow:0 9px 0 #A79FB8,0 18px 30px rgba(20,10,60,.35)}
.node.locked .ico{filter:grayscale(1);opacity:.35}
.node .lock{position:absolute;width:62px;height:62px}
.node.next{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 9px 0 var(--papel2),0 0 0 0 rgba(255,214,90,.9)}50%{box-shadow:0 9px 0 var(--papel2),0 0 0 18px rgba(255,214,90,0)}}
.nstars{position:absolute;display:flex;gap:2px;transform:translateX(-50%)}
.nstars svg{width:36px;height:36px}
.nname{position:absolute;transform:translateX(-50%);font-family:var(--display);font-size:22px;color:#fff;white-space:nowrap;
  -webkit-text-stroke:6px var(--noche);paint-order:stroke fill}
.topbar{position:absolute;top:16px;left:20px;right:20px;display:flex;align-items:center;gap:16px;z-index:60}
.counter{font-family:var(--display);font-size:34px;background:var(--papel);border-radius:999px;padding:8px 22px 10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 0 var(--papel2)}
.counter svg{width:46px;height:46px}

/* Puzzle */
.board{position:absolute;border-radius:24px;background:#5A8F4E;box-shadow:0 10px 0 #3E6B35,0 20px 40px rgba(0,0,0,.3)}
.tile{position:absolute;border-radius:16px;overflow:hidden;cursor:pointer;transition:left .22s ease,top .22s ease;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.tile svg{width:100%;height:100%;display:block}
.tile.can{animation:canmove 1.2s ease-in-out infinite}
@keyframes canmove{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.2),0 0 0 0 rgba(255,214,90,.0)}50%{box-shadow:0 4px 0 rgba(0,0,0,.2),0 0 0 7px rgba(255,214,90,.95)}}

/* Escenas varias */
.light{cursor:pointer}
.dark{position:absolute;inset:0;background:#0B0A2A;opacity:0;transition:opacity .8s;pointer-events:none}
.glowbox{animation:pulse 1.2s ease-in-out infinite}
.bubble5{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;cursor:pointer;touch-action:none;left:0;top:0}
.bubble5 svg{width:100%;height:100%;overflow:visible}
.popping{animation:pop5 .35s ease-out forwards;pointer-events:none}
@keyframes pop5{to{transform:scale(1.6);opacity:0}}
.twinkle{animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
.tbub{position:absolute;z-index:85;transform:translate(-50%,-100%);background:#fff;border-radius:26px;padding:12px 22px 14px;font-family:var(--display);font-size:26px;
  box-shadow:0 6px 0 rgba(46,42,79,.15);animation:popIn .3s cubic-bezier(.3,1.5,.5,1) both;max-width:420px;text-align:center;pointer-events:none;text-wrap:balance}
.tbub:after{content:"";position:absolute;left:50%;bottom:-16px;margin-left:-12px;border:12px solid transparent;border-top:16px solid #fff;border-bottom:0}
.choice{position:absolute;background:#fff;border:none;border-radius:30px;cursor:pointer;padding:14px;box-shadow:0 9px 0 #EADBC0,0 16px 28px rgba(0,0,0,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:25px;line-height:1.1;text-align:center;transition:transform .12s}
.choice:active{transform:translateY(6px)}
.choice.right{outline:7px solid var(--musgo)}
.choice .pic{display:grid;place-items:center}
.rot-hint{position:fixed;inset:0;z-index:999;background:var(--noche);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px;font-family:var(--display);font-size:26px}
.rot-hint.show{display:flex}
.rot-hint svg{width:120px;height:120px}

@media (prefers-reduced-motion: reduce){
  .float,.bob,.pulse,.node.next,.tile.can,.glowbox{animation:none!important}
  .screen,.card{animation-duration:.01s!important}
}

</style>
</head>
<body>
<div id="stage" role="application" aria-label="Juego Guardianes del Valle Dormilón"></div>
<script>
/* ============ ARTE: personajes, iconos y escenarios (SVG original) ============ */
const INK='#2E2A4F';
let _uid=0; const uid=p=>(p||'u')+(++_uid);

/* PRNG con semilla para que los escenarios sean siempre iguales */
function seeded(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function smooth(pts){
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length-1;i++){const[x,y]=pts[i],[nx,ny]=pts[i+1];d+=` Q${x.toFixed(1)} ${y.toFixed(1)} ${((x+nx)/2).toFixed(1)} ${((y+ny)/2).toFixed(1)}`}
  const l=pts[pts.length-1];return d+` L${l[0].toFixed(1)} ${l[1].toFixed(1)}`;
}
function hill(y0,amp,waves,phase,fill,cut=true,W=1280,H=720){
  const pts=[];const N=28;
  for(let i=0;i<=N;i++){const t=i/N;pts.push([t*W,y0+Math.sin(t*Math.PI*2*waves+phase)*amp+Math.sin(t*Math.PI*2*waves*2.3+phase*1.7)*amp*.35])}
  return `<path d="${smooth(pts)} L${W} ${H} L0 ${H} Z" fill="${fill}" ${cut?'filter="url(#cut)"':''}/>`;
}
function tree(x,y,s=1,c='#3E9A5C',fruit){
  let f='';if(fruit){const r=seeded(x*7+y);for(let i=0;i<6;i++)f+=`<circle cx="${(r()*60-30).toFixed(0)}" cy="${(-20-r()*45).toFixed(0)}" r="6" fill="${fruit}"/>`}
  return `<g transform="translate(${x} ${y}) scale(${s})" filter="url(#cut)"><rect x="-8" y="-14" width="16" height="44" rx="6" fill="#8A5A3B"/><circle cx="0" cy="-42" r="36" fill="${c}"/><circle cx="-26" cy="-22" r="25" fill="${c}"/><circle cx="26" cy="-22" r="25" fill="${c}"/><circle cx="-12" cy="-56" r="13" fill="#fff" opacity=".14"/>${f}</g>`;
}
function pine(x,y,s=1,c='#2F7A55'){
  return `<g transform="translate(${x} ${y}) scale(${s})" filter="url(#cut)"><rect x="-6" y="-6" width="12" height="26" fill="#7A4E33"/><path d="M0 -110 L34 -50 L18 -50 L44 -6 L-44 -6 L-18 -50 L-34 -50 Z" fill="${c}"/></g>`;
}
function bush(x,y,s=1,c='#4FA868'){
  return `<g transform="translate(${x} ${y}) scale(${s})" filter="url(#cut)"><circle cx="-24" cy="0" r="22" fill="${c}"/><circle cx="0" cy="-12" r="28" fill="${c}"/><circle cx="26" cy="0" r="22" fill="${c}"/><rect x="-46" y="0" width="92" height="20" fill="${c}"/></g>`;
}
function flower(x,y,c='#FF8FB1',s=1){
  let p='';for(let i=0;i<5;i++){const a=i*72*Math.PI/180;p+=`<circle cx="${(Math.cos(a)*9).toFixed(1)}" cy="${(Math.sin(a)*9).toFixed(1)}" r="7" fill="${c}"/>`}
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 Q3 16 0 30" stroke="#3E9A5C" stroke-width="4" fill="none"/>${p}<circle r="6" fill="#FFC94D"/></g>`;
}
function cloudShape(x,y,s=1,o=.9){
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}"><circle cx="0" cy="0" r="26" fill="#fff"/><circle cx="30" cy="-12" r="32" fill="#fff"/><circle cx="62" cy="0" r="24" fill="#fff"/><rect x="0" y="0" width="62" height="24" fill="#fff"/></g>`;
}
function starField(n,seed,y1=0,y2=360,tw=true){
  const r=seeded(seed);let s='';
  for(let i=0;i<n;i++){const x=r()*1280,y=y1+r()*(y2-y1),rad=r()*2.2+.8;s+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rad.toFixed(1)}" fill="#FFF6D8" ${tw&&i%3==0?`class="twinkle" style="animation-delay:${(r()*3).toFixed(1)}s"`:''}/>`}
  return s;
}
function starPath(cx,cy,r,fill,stroke){
  let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.48:r;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1)}
  return `<path d="${d}Z" fill="${fill}" ${stroke?`stroke="${stroke}" stroke-width="${r*.16}" stroke-linejoin="round"`:''}/>`;
}
function moon(x,y,r){
  return `<g><circle cx="${x}" cy="${y}" r="${r*1.9}" fill="#FFF1C1" opacity=".12"/><circle cx="${x}" cy="${y}" r="${r}" fill="#FFF1C1"/><circle cx="${x-r*.3}" cy="${y-r*.2}" r="${r*.18}" fill="#EBD9A0"/><circle cx="${x+r*.35}" cy="${y+r*.3}" r="${r*.12}" fill="#EBD9A0"/><circle cx="${x+r*.1}" cy="${y-r*.45}" r="${r*.08}" fill="#EBD9A0"/></g>`;
}
function cabin(x,y,s=1,lit=true){
  return `<g transform="translate(${x} ${y}) scale(${s})" filter="url(#cut)">
  <rect x="-90" y="-80" width="180" height="120" rx="14" fill="#C9875A"/>
  <path d="M-90 -50 H90 M-90 -20 H90 M-90 10 H90" stroke="#A86B43" stroke-width="5"/>
  <path d="M-118 -70 Q0 -190 118 -70 Q0 -96 -118 -70Z" fill="#E2574C"/>
  <circle cx="-50" cy="-118" r="9" fill="#fff" opacity=".9"/><circle cx="20" cy="-136" r="10" fill="#fff" opacity=".9"/><circle cx="62" cy="-104" r="8" fill="#fff" opacity=".9"/>
  <rect x="44" y="-180" width="24" height="56" fill="#8C5B3F"/>
  <path d="M-26 40 V-14 Q0 -46 26 -14 V40Z" fill="#6B3F27"/><circle cx="14" cy="10" r="4" fill="#FFC94D"/>

function mix(a,b,t){t=Math.max(0,Math.min(1,t));const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
const GRIS='#A9B1C2',AZUL='#5EC6FF';
const lumiColor=t=>mix(GRIS,AZUL,t);

/* ---------- Pantallas ---------- */
let leaveFns=[];let TOKEN=0;
function onLeave(f){leaveFns.push(f)}
function later(fn,ms){const t=TOKEN;const id=setTimeout(()=>{if(t===TOKEN)fn()},ms);onLeave(()=>clearTimeout(id));return id}
function wait(ms){const t=TOKEN;return new Promise((res,rej)=>setTimeout(()=>t===TOKEN?res():rej('salio'),ms))}
function loop(fn){let last=performance.now(),run=true,id;const f=now=>{if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(fn(dt,now)===false)return;id=requestAnimationFrame(f)};id=requestAnimationFrame(f);const stop=()=>{run=false;cancelAnimationFrame(id)};onLeave(stop);return stop}
function go(builder,...args){
  leaveFns.forEach(f=>{try{f()}catch(e){}});leaveFns=[];TOKEN++;
  stopSpeech();closeModal();
  $$('.screen').forEach(s=>s.remove());
  const scr=el('<div class="screen"></div>');stage.prepend(scr);
  narr.classList.remove('gone');quiet(true);
  builder(scr,...args);
}

/* ---------- Sonido (Web Audio, sin archivos) ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,{t=0,d=.2,type='sine',v=.18,to=null,attack=.012}={}){
  if(!G.sound)return;const a=ac();if(!a)return;
  const now=a.currentTime+t;const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,now);if(to)o.frequency.exponentialRampToValueAtTime(to,now+d);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(v,now+attack);g.gain.exponentialRampToValueAtTime(.0001,now+d);
  o.connect(g).connect(a.destination);o.start(now);o.stop(now+d+.05);
}
function noise({t=0,d=.25,v=.08,f=900}={}){
  if(!G.sound)return;const a=ac();if(!a)return;const now=a.currentTime+t;
  const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=.8;
  const g=a.createGain();g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);
  s.connect(fl).connect(g).connect(a.destination);s.start(now);
}

/* ---------- Voz de Don Plumas (síntesis de voz del navegador) ---------- */
let VOICE=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices().filter(v=>/^es(-|_|$)/i.test(v.lang));
  if(!vs.length)return;
  const pref=['es-MX','es-US','es-419','es-CO','es-AR','es-ES'];
  const score=v=>{let s=0;const i=pref.findIndex(p=>v.lang.replace('_','-').toLowerCase()===p.toLowerCase());s+=i<0?0:(10-i)*10;if(/natural|neural|online|google/i.test(v.name))s+=25;if(/paulina|sabina|dalia|jorge|elvira|helena/i.test(v.name))s+=8;return s};
  VOICE=vs.sort((a,b)=>score(b)-score(a))[0];
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let speakId=0;
function stopSpeech(){speakId++;try{speechSynthesis.cancel()}catch(e){}stage.classList.remove('talking')}
function speak(text,opt={}){
  const my=++speakId;
  return new Promise(res=>{
    let done=false;const finish=()=>{if(done)return;done=true;if(my===speakId)stage.classList.remove('talking');res()};
    stage.classList.add('talking');
    const est=900+text.length*62;
    if(!G.voice||!('speechSynthesis' in window)){setTimeout(finish,Math.min(4200,est*.6));return}
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text.replace(/[¡¿]/g,''));
      if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='es-MX';
      u.rate=opt.rate||.95;u.pitch=opt.pitch||1.08;u.onend=finish;u.onerror=finish;
      setTimeout(()=>{if(my===speakId)speechSynthesis.speak(u)},60);
      setTimeout(finish,est*1.6+1500);
    }catch(e){setTimeout(finish,est)}
  });
}

const narr=el(`<div id="narr" class="quiet">${owlSVG()}<div class="bubble"><span class="txt"></span></div></div>`);
let lastLine='';let quietTimer=null;
function quiet(now){clearTimeout(quietTimer);if(now)narr.classList.add('quiet');else quietTimer=setTimeout(()=>narr.classList.add('quiet'),2600)}
function say(text,{stay=false}={}){
  lastLine=text;narr.classList.remove('gone','quiet');
  narr.querySelector('.txt').textContent=text;clearTimeout(quietTimer);
  return speak(text).then(()=>{if(!stay&&lastLine===text)quiet()});
}
let lastThrottle=0;
function sayThrottled(text,ms=3200){const n=performance.now();if(n-lastThrottle<ms)return;lastThrottle=n;say(text)}
function hideNarr(){narr.classList.add('gone')}

/* ---------- Coordenadas del escenario y arrastre ---------- */
function stagePt(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/SCALE,y:(e.clientY-r.top)/SCALE}}
function rectOf(n){const r=n.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:(r.left-s.left)/SCALE,y:(r.top-s.top)/SCALE,w:r.width/SCALE,h:r.height/SCALE}}
function centerOf(n){const r=rectOf(n);return{x:r.x+r.w/2,y:r.y+r.h/2}}
function hit(p,n,pad=0){const r=rectOf(n);return p.x>=r.x-pad&&p.x<=r.x+r.w+pad&&p.y>=r.y-pad&&p.y<=r.y+r.h+pad}
function makeDraggable(node,{onDrop,onStart,onMove}={}){
  node.classList.add('drag');let sx=0,sy=0,ox=0,oy=0,id=null,on=false;
  node.addEventListener('pointerdown',e=>{
    if(node.dataset.locked)return;e.preventDefault();ac();
    if(onStart&&onStart()===false){node.classList.add('wiggle');setTimeout(()=>node.classList.remove('wiggle'),460);return}
    id=e.pointerId;try{node.setPointerCapture(id)}catch(_){}
    const p=stagePt(e);ox=parseFloat(node.style.left)||0;oy=parseFloat(node.style.top)||0;sx=p.x;sy=p.y;on=true;node.classList.add('dragging');node.classList.remove('returning');
  });
  node.addEventListener('pointermove',e=>{if(!on||e.pointerId!==id)return;const p=stagePt(e);node.style.left=(ox+p.x-sx)+'px';node.style.top=(oy+p.y-sy)+'px';onMove&&onMove(p)});
  const end=e=>{
    if(!on||e.pointerId!==id)return;on=false;node.classList.remove('dragging');
    const p=stagePt(e);const ok=onDrop?onDrop(p,{ox,oy}):false;
    if(!ok){node.classList.add('returning');node.style.left=ox+'px';node.style.top=oy+'px';setTimeout(()=>node.classList.remove('returning'),340)}
  };
  node.addEventListener('pointerup',end);node.addEventListener('pointercancel',end);
}
function tapped(node,fn){node.addEventListener('pointerdown',e=>{e.preventDefault();ac();fn(e)})}

const SPARK_SVG=`<svg viewBox="0 0 100 100">${starPath(50,50,46,'#FFE08A','#fff')}</svg>`;
function sparkle(x,y,n=10,host=stage){
  for(let i=0;i<n;i++){const s=el(`<div class="spark">${SPARK_SVG}</div>`);const a=Math.random()*Math.PI*2,d=rand(60,150);
    s.style.left=(x-13)+'px';s.style.top=(y-13)+'px';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
    host.appendChild(s);setTimeout(()=>s.remove(),850)}
}
function floatText(x,y,t,color){const f=el(`<div class="ftext">${t}</div>`);place(f,x,y-30);if(color)f.style.color=color;stage.appendChild(f);setTimeout(()=>f.remove(),1150)}
function flash(node,cls,ms=600){node.classList.remove(cls);void node.offsetWidth;node.classList.add(cls);setTimeout(()=>node.classList.remove(cls),ms)}

function talkBubble(x,y,text,ms=2600){const b=el(`<div class="tbub">${text}</div>`);place(b,x,y);stage.appendChild(b);setTimeout(()=>b.remove(),ms);onLeave(()=>b.remove());return b}

function makeGrain(){

}

/* ======================= NIVEL 1: Un Lugar Seguro para Jugar (función L1) ======================= */
function L1(ctx){
  const {play}=ctx;
  const lumi=place(el(`<div class="abs bob" style="width:130px">${lumiSVG({mood:'sad',color:lumiColor(.15)})}</div>`),24,404);
  play.appendChild(lumi);
  const HZ=[
    {k:'enchufe',x:300,y:228,w:110,h:170,msg:'¡Bien! Los enchufes pueden dar toques. Ya está tapado.'},
    {k:'charco',x:420,y:440,w:200,h:100,msg:'¡Muy bien! En el agua profunda solo se entra con un adulto.'},
    {k:'fuego',x:700,y:280,w:150,h:160,msg:'¡Excelente! El fuego quema. Lumi ya no se acercará.'},
    {k:'tijeras',x:870,y:480,w:130,h:100,msg:'¡Genial! Las tijeras con punta se guardan en su lugar.'}
  ];
  const SAFE=[
    {k:'flor',x:540,y:250,w:90,h:118,msg:'Esa flor es bonita y no hace daño. Busca algo peligroso.'},
    {k:'pelota',x:150,y:280,w:96,h:96,msg:'La pelota sirve para jugar, no es peligrosa. ¡Intenta otra vez!'}
  ];
  [...HZ,...SAFE].forEach(o=>{o.node=place(el(`<div class="abs" style="width:${o.w}px;height:${o.h}px">${OBJ[o.k]}</div>`),o.x,o.y);play.appendChild(o.node)});
  // Fuente de escudos
  play.appendChild(place(el(`<div class="abs" style="width:160px;height:150px;border-radius:50%;background:radial-gradient(circle,#FFF4DE 0 55%,rgba(255,244,222,0) 70%)"></div>`),1110,560));
  let covered=0,idle;
  const remaining=()=>HZ.filter(h=>!h.done);
  function resetIdle(){clearTimeout(idle);idle=later(()=>{const r=remaining();if(!r.length)return;flash(r[0].node,'wiggle',460);say('Busca algo que pueda lastimar a Lumi y arrastra un escudo encima.');resetIdle()},15000)}
  function spawnShield(){
    const s=place(el(`<div class="abs pulse" style="width:96px;height:106px;z-index:5">${OBJ.escudo}</div>`),1142,580);
    play.appendChild(s);
    makeDraggable(s,{onStart:()=>{s.classList.remove('pulse');resetIdle()},onDrop:p=>{
      const h=HZ.find(h=>!h.done&&hit(p,h.node,26));
      if(h){
        h.done=true;covered++;s.remove();SFX.shield();
        const d=el(`<div class="abs" style="left:0;top:0;width:100%;height:100%;animation:popIn .5s cubic-bezier(.3,1.5,.5,1) both">${OBJ.domo}</div>`);
        h.node.appendChild(d);h.node.style.filter='saturate(.5)';
        const c=centerOf(h.node);sparkle(c.x,c.y,12);floatText(c.x,c.y-40,'¡Seguro!');
        ctx.fill(covered);setLumi(lumi,{color:lumiColor(.15+covered*.21),mood:covered>=HZ.length?'happy':'sad'});
        if(covered<HZ.length){say(h.msg);spawnShield()}else finish();
        return true;
      }
      const sf=SAFE.find(o=>hit(p,o.node,10));
      if(sf){ctx.err(sf.msg);flash(sf.node,'wiggle',460)}
      return false;
    }});
  }
  async function finish(){
    clearTimeout(idle);
    await say('¡Todo está seguro! Ahora Lumi puede salir a jugar.');
    if(ctx.done)return;
    setLumi(lumi,{mood:'happy',color:AZUL});
    lumi.classList.remove('bob');lumi.style.transition='left .7s ease-in-out, top .7s ease-in-out';
    place(lumi,250,292);try{await wait(760)}catch(e){return}
    const ball=SAFE.find(o=>o.k==='pelota').node;
    ball.animate([{transform:'translateY(0)'},{transform:'translateY(-130px)'},{transform:'translateY(0)'}],{duration:700,iterations:4,easing:'ease-in-out'});
    lumi.firstElementChild.animate([{transform:'translateY(0)'},{transform:'translateY(-50px)'},{transform:'translateY(0)'}],{duration:700,iterations:4,delay:350,easing:'ease-in-out'});
    for(let k=0;k<4;k++)later(SFX.boing,k*700);
    sparkle(250,300,14);say('¡Qué divertido es jugar en un lugar seguro!');
    ctx.win(3400);
  }
  ctx.meter(HZ.length,ICON.shieldS);
  say('Arrastra los escudos y ponlos encima de las cosas peligrosas.');
  spawnShield();resetIdle();
}

/* ======================= NIVEL 2: ¡Hora de Recreo! (función L3) ======================= */
function L3(ctx){
  const {play}=ctx;
  play.insertAdjacentHTML('beforeend',parkSymbol());
  const T=150,BX=730,BY=132;
  play.insertAdjacentHTML('beforeend',`<div class="abs card" style="left:190px;top:160px;width:290px;padding:18px;animation:none;transform:rotate(-2deg)"><div style="font-family:var(--display);font-size:24px;margin-bottom:8px">Así debe quedar</div><svg viewBox="0 0 480 480" style="width:254px;border-radius:14px;display:block"><use href="#park" width="480" height="480"/></svg></div>`);
  const board=place(el(`<div class="board" style="width:${3*T+12}px;height:${3*T+12}px"></div>`),BX,BY);play.appendChild(board);
  let pos=[0,1,2,3,4,5,6,7];let empty=8;let moves=0,wrongs=0,solved=false;
  const tiles=pos.map(t=>{const r=Math.floor(t/3),c=t%3;const n=el(`<div class="tile" style="width:${T-6}px;height:${T-6}px"><svg viewBox="${c*160} ${r*160} 160 160" preserveAspectRatio="none"><use href="#park" width="480" height="480"/></svg></div>`);board.appendChild(n);return n});
  const adj=(a,b)=>{const ra=Math.floor(a/3),ca=a%3,rb=Math.floor(b/3),cb=b%3;return Math.abs(ra-rb)+Math.abs(ca-cb)===1};
  function shuffleBoard(){let last=-1;for(let s=0;s<16;s++){const opts=pos.map((p,t)=>t).filter(t=>adj(pos[t],empty)&&t!==last);const t=pick(opts);[pos[t],empty]=[empty,pos[t]];last=t}}
  do{pos=[0,1,2,3,4,5,6,7];empty=8;shuffleBoard()}while(pos.filter((p,t)=>p===t).length>4);
  function layout(){tiles.forEach((n,t)=>{const p=pos[t];place(n,6+(p%3)*T,6+Math.floor(p/3)*T);n.classList.toggle('can',!solved&&adj(p,empty))})}
  layout();
  tiles.forEach((n,t)=>tapped(n,()=>{
    if(solved)return;
    if(adj(pos[t],empty)){[pos[t],empty]=[empty,pos[t]];moves++;SFX.tap();layout();
      if(pos.every((p,i)=>p===i))win();}
    else{wrongs++;ctx.errors++;flash(n,'wiggle',460);SFX.oops();if(wrongs<=2||wrongs%4===0)say('Esa pieza no se puede mover. Toca una pieza que brille, junto al espacio vacío.')}
  }));
  say('Toca las piezas que brillan para moverlas y arma el parque igual al dibujo.');
  function win(){
    solved=true;layout();
    const last=el(`<div class="tile" style="width:${T-6}px;height:${T-6}px;animation:popIn .5s both"><svg viewBox="320 320 160 160" preserveAspectRatio="none"><use href="#park" width="480" height="480"/></svg></div>`);
    place(last,6+2*T,6+2*T);board.appendChild(last);
    SFX.win();const c=centerOf(board);sparkle(c.x,c.y,20);
    say('¡Armaste el parque! Ahora, ¡a jugar con los amigos de Lumi!');
    later(phaseB,3000);
  }
  function phaseB(){
    play.innerHTML=bgMeadow();
    const GOAL=12;let joy=0;ctx.meter(GOAL,ICON.smile);
    const friends=[{n:'Saltarín',salt:true,x:330},{n:'Lumi',c:AZUL,acc:[],x:565},{n:'Bru',c:'#8EE3B5',acc:['hoja'],x:800}];
    friends.forEach((f,k)=>{
      const box=place(el(`<div class="abs" style="width:170px;height:260px;cursor:pointer">
        <svg class="rope" viewBox="0 0 230 260" style="position:absolute;left:-30px;top:-10px;width:230px;height:260px;overflow:visible;transform-origin:50% 210px"><path d="M30 210 Q115 -60 200 210" stroke="#E2574C" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="20" y="196" width="18" height="30" rx="6" fill="#FFC94D"/><rect x="192" y="196" width="18" height="30" rx="6" fill="#FFC94D"/></svg>
        ${f.salt?`<div class="who" style="position:absolute;left:33px;top:44px;width:104px">${saltarinSVG()}</div>`:`<div class="who" style="position:absolute;left:10px;top:70px;width:150px">${lumiSVG({mood:'happy',color:f.c,acc:f.acc})}</div>`}
        <div class="nname" style="left:85px;top:228px">${f.n}</div></div>`),f.x,250);
      play.appendChild(box);
      const who=box.querySelector('.who'),rope=box.querySelector('.rope');let busy=false;
      tapped(box,()=>{
        if(busy||joy>=GOAL)return;busy=true;
        who.animate([{transform:'translateY(0) scale(1.08,.92)'},{transform:'translateY(-110px) scale(.95,1.05)',offset:.5},{transform:'translateY(0) scale(1)'}],{duration:620,easing:'ease-in-out'});
        rope.animate([{transform:'scaleY(1)'},{transform:'scaleY(-.55)',offset:.5},{transform:'scaleY(1)'}],{duration:620,easing:'ease-in-out'});
        SFX.boing();later(SFX.giggle,300);setLumi(who,{mood:'wow'});later(()=>setLumi(who,{mood:'happy'}),620);
        joy++;ctx.fill(joy);const c=centerOf(box);floatText(c.x,c.y-120,pick(['¡Ji ji!','¡Yupi!','¡Je je!']));
        later(()=>{busy=false},420);
        if(joy===6)say('¡Mira cómo se ríen! Sigue tocándolos.');
        if(joy>=GOAL)allJump();
      });
    });
    say('Toca a Lumi y a sus amigos para que salten la cuerda. ¡Llena la barra de alegría!');
    function allJump(){
      SFX.win();sparkle(640,300,24);
      $$('.who',play).forEach((w,k)=>{setLumi(w,{mood:'wow'});w.animate([{transform:'translateY(0)'},{transform:'translateY(-90px)'},{transform:'translateY(0)'}],{duration:600,iterations:4,delay:k*120,easing:'ease-in-out'})});
      say('¡Qué divertido! Jugar con amigos nos hace muy felices.');
      ctx.win(3200);
    }
  }
}

};
const DREAM_ICONS={
  luna:`<path d="M58 22 A30 30 0 1 0 80 64 A24 24 0 1 1 58 22Z" fill="#FFE08A"/>`,
  estrella:starPath(50,52,28,'#FFE08A'),
  corazon:`<path d="M50 80 C22 62 16 46 26 36 C34 28 46 32 50 42 C54 32 66 28 74 36 C84 46 78 62 50 80Z" fill="#FF8FB1"/>`,
  arcoiris:`<path d="M18 70 A32 32 0 0 1 82 70" stroke="#E2574C" stroke-width="7" fill="none"/><path d="M25 70 A25 25 0 0 1 75 70" stroke="#FFC94D" stroke-width="7" fill="none"/><path d="M32 70 A18 18 0 0 1 68 70" stroke="#6CC07A" stroke-width="7" fill="none"/><path d="M39 70 A11 11 0 0 1 61 70" stroke="#5EC6FF" stroke-width="7" fill="none"/>`
};
function bubbleSVG(noisy,icon){
  if(noisy){let d='';for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=i%2?44:50;d+=(i?'L':'M')+(50+Math.cos(a)*r).toFixed(1)+' '+(50+Math.sin(a)*r).toFixed(1)}
    return `<svg viewBox="0 0 100 100"><path d="${d}Z" fill="#3B2E6E" stroke="#B9A6FF" stroke-width="3" stroke-linejoin="round" opacity=".92"/>${icon}</svg>`}
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#BFE8FF" opacity=".55" stroke="#fff" stroke-width="3"/><path d="M24 34 Q30 20 46 16" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>${icon}</svg>`;
}
function popB(n){n.style.pointerEvents='none';n.firstElementChild.classList.add('popping');setTimeout(()=>n.remove(),380)}
function L5(ctx){
  const {play}=ctx;const DUR=40,TARGET={x:640,y:450};
  const dawn=el(`<svg class="bg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" style="opacity:0;transition:opacity 3s;pointer-events:none"><rect width="1280" height="720" fill="url(#skyDawn)"/><circle class="sunr" cx="640" cy="560" r="80" fill="#FFC94D"/>${hill(500,30,1.2,.8,'#7CCB6A')}${hill(590,20,1.8,2.5,'#5DB97A')}</svg>`);
  play.appendChild(dawn);
  play.insertAdjacentHTML('beforeend',`<div class="abs" style="left:500px;top:470px;width:280px;height:120px"><svg viewBox="0 0 280 120"><path d="M30 110 Q0 110 6 84 Q10 60 40 62 Q46 30 86 34 Q110 6 150 24 Q190 10 214 40 Q258 38 262 72 Q284 86 270 104 Q262 112 240 110Z" fill="#fff" opacity=".95"/></svg></div>`);
  const lumi=place(el(`<div class="abs" style="width:180px">${lumiSVG({mood:'sleep',color:'#8EC9F0',acc:['gorro']})}</div>`),548,368);play.appendChild(lumi);
  const zz=place(el('<div class="zzz">z</div>'),690,360);play.appendChild(zz);
  const night=el(`<div class="abs" style="left:420px;top:118px;width:440px;height:56px;display:flex;align-items:center;gap:10px;background:rgba(255,244,222,.92);border-radius:999px;padding:6px 14px;box-shadow:0 5px 0 var(--papel2)"><span style="width:40px;height:40px">${ICON.moonI}</span><span style="flex:1;height:18px;border-radius:9px;background:#D9CDB6;overflow:hidden"><b id="nf" style="display:block;height:100%;width:0;background:linear-gradient(90deg,#7A6CFF,#FFC94D);border-radius:9px"></b></span><span style="width:40px;height:40px">${ICON.sun}</span></div>`);
  play.appendChild(night);const nf=night.querySelector('#nf');
  let t=0,spawnT=2.6,bubbles=[],sleep=5,hits=0,popped=0,state='play';
  ctx.meter(5,ICON.moonI,true);ctx.fill(5);
  function spawn(){
    const noisy=Math.random()<.66;const set=noisy?NOISE_ICONS:DREAM_ICONS;const k=pick(Object.keys(set));
    const side=pick(['l','r','t']);let x,y;
    if(side==='l'){x=-60;y=rand(180,380)}else if(side==='r'){x=1340;y=rand(180,520)}else{x=pick([rand(180,380),rand(900,1100)]);y=170}
    const n=el(`<div class="bubble5">${bubbleSVG(noisy,set[k])}</div>`);n.style.transform=`translate(${x}px,${y}px)`;play.appendChild(n);
    if(side==='t')n.firstElementChild.animate([{transform:'scale(0)'},{transform:'scale(1)'}],{duration:400,easing:'ease-out'});
    const b={n,noisy,x,y,ph:rand(0,6.28),sp:(side==='t'?55:rand(80,95))+t*.8};
    tapped(n,()=>{
      if(b.gone||state!=='play')return;
      if(b.noisy){b.gone=true;popped++;popB(n);SFX.softpop();sparkle(b.x,b.y,6);floatText(b.x,b.y-30,'¡Shh!');}
      else{ctx.errors++;SFX.oops();flash(n.firstElementChild,'wiggle',460);sayThrottled('Esa burbuja es un sueño bonito. ¡Déjala pasar!',2500)}
    });
    bubbles.push(b);
  }
  say('Revienta las burbujas oscuras de ruido. Las burbujas claras son sueños bonitos: ¡déjalas pasar!');
  loop(dt=>{
    if(state!=='play')return;
    t+=dt;nf.style.width=Math.min(100,t/DUR*100)+'%';
    spawnT-=dt;if(t<DUR-5&&spawnT<=0){spawn();spawnT=rand(1.25,1.7)-Math.min(.35,t/DUR*.4)}
    for(const b of bubbles){
      if(b.gone)continue;
      const dx=TARGET.x-b.x,dy=TARGET.y-b.y,d=Math.hypot(dx,dy);
      b.x+=dx/d*b.sp*dt;b.y+=dy/d*b.sp*dt;b.ph+=dt*3;
      b.n.style.transform=`translate(${b.x}px,${b.y+Math.sin(b.ph)*8}px)`;
      if(d<95){b.gone=true;popB(b.n);
        if(b.noisy){sleep--;hits++;ctx.fill(sleep);SFX.thud();flash(lumi,'shake',500);setLumi(lumi,{mood:'tired'});later(()=>state==='play'&&setLumi(lumi,{mood:'sleep'}),900);
          if(sleep<=0){fail();return}
          sayThrottled('¡Uy, un ruido! Toca las burbujas oscuras antes de que lleguen.',3500)}
        else{SFX.star(1);sparkle(TARGET.x,TARGET.y-60,6)}
      }
    }
    bubbles=bubbles.filter(b=>!b.gone);
    if(t>=DUR&&!bubbles.some(b=>b.noisy))morning();
  });
  function clearBubbles(){bubbles.forEach(b=>{b.gone=true;popB(b.n)});bubbles=[]}
  function fail(){
    state='fail';clearBubbles();setLumi(lumi,{mood:'sad',color:GRIS});zz.style.display='none';
    say('Lumi se despertó con tanto ruido. ¡No pasa nada! Intentemos otra vez.',{stay:true});
    const m=modal(`<div style="width:160px;margin:0 auto">${lumiSVG({mood:'sad',color:GRIS,acc:['gorro']})}</div><h2 style="font-size:46px">¡Casi lo logras!</h2><p>Revienta las burbujas oscuras antes de que lleguen a Lumi.</p><div class="row" style="margin-top:16px"><button class="btn verde" id="again">${ICON.replay} Intentar otra vez</button></div>`);
    $('#again',m).addEventListener('click',()=>{SFX.tap();closeModal();t=0;sleep=5;spawnT=2;hits=0;ctx.errors++;ctx.fill(5);setLumi(lumi,{mood:'sleep',color:'#8EC9F0'});zz.style.display='';state='play';say('¡Tú puedes! Revienta las burbujas oscuras.')});
  }
  function morning(){
    state='end';clearBubbles();ctx.errors+=hits;
    dawn.style.opacity='1';dawn.querySelector('.sunr').animate([{transform:'translateY(0)'},{transform:'translateY(-300px)'}],{duration:3200,fill:'forwards',easing:'ease-out'});
    later(()=>{zz.remove();setLumi(lumi,{mood:'happy',color:AZUL});lumi.classList.add('float');SFX.win();sparkle(640,420,20);
      const c=centerOf(lumi);talkBubble(c.x,c.y-90,'¡Ya descansé! ¡Vamos a jugar!',3600);
      speak('¡Ya descansé! ¡Vamos a jugar!',{pitch:1.6,rate:1.05}).then(()=>say('¡Buenos días! Lumi durmió toda la noche y despertó con energía para jugar.'))},2200);
    ctx.win(6000);
  }
}

function LAmigos(ctx){
  const {play}=ctx;
  const mini=(svg,w)=>`<div style="width:${w}px">${svg}</div>`;
  const heart=`<div style="width:46px">${ICON.heart}</div>`;
  const Q=[
    {q:'Este es Saltarín. Es un conejo, no es una nube. ¿Puede jugar con todos?',
     good:['¡Sí! Todos juegan',`<div class="row" style="gap:4px;flex-wrap:nowrap;align-items:center">${mini(lumiSVG({mood:'happy'}),120)}${heart}${mini(saltarinSVG(),100)}</div>`],
     bad:['No, porque es diferente',`${mini(saltarinSVG({mood:'sad'}),126)}`],
     ok:'¡Muy bien! Ser diferente no está mal. Todos podemos jugar juntos.',why:'Mmm, ser diferente no es malo. Todos tienen derecho a jugar. ¡Intenta otra vez!'},
    {q:'Nubi usa lentes y algunos se ríen de ella. ¿Qué hacemos?',
     good:['La respetamos y jugamos con ella',`<div class="row" style="gap:4px;flex-wrap:nowrap">${mini(lumiSVG({mood:'happy',color:'#C7B8FF',front:['lentes']}),190)}${heart}</div>`],
     bad:['Nos reímos también',`${mini(sombraSVG(),170)}`],
     ok:'¡Eso es! Burlarse lastima. Todos merecemos respeto.',why:'Reírse de alguien lo pone triste. Mejor lo respetamos. ¡Intenta otra vez!'},
    {q:'Tito es muy pequeñito y no alcanza el columpio. ¿Qué hacemos?',
     good:['Lo ayudamos',`<div class="row" style="gap:6px;flex-wrap:nowrap;align-items:flex-end">${mini(lumiSVG({mood:'happy'}),130)}${mini(ICON_SWING.replace('class="ico"',''),70)}${mini(lumiSVG({mood:'happy',color:'#FFD84D'}),74)}</div>`],
     bad:['Lo dejamos solo',`${mini(lumiSVG({mood:'sad',color:'#FFD84D'}),130)}`],
     ok:'¡Muy bien! Lo ayudamos para que también pueda jugar.',why:'Si lo dejamos solo, se siente triste. Ayudar es de buenos amigos. ¡Intenta otra vez!'}
  ];
  let r=0;ctx.meter(4,ICON_AMIGOS);
  function round(){
    $$('.choice',play).forEach(c=>c.remove());
    const q=Q[r];const opts=shuffle([['good',q.good],['bad',q.bad]]);
    opts.forEach(([kind,[label,pic]],k)=>{
      const c=place(el(`<button class="choice" style="width:320px;height:310px"><div class="pic" style="height:200px">${pic}</div><div>${label}</div></button>`),300+k*380,170);
      play.appendChild(c);
      c.addEventListener('click',async()=>{
        if(c.dataset.used)return;
        if(kind==='good'){
          $$('.choice',play).forEach(x=>x.dataset.used='1');c.classList.add('right');SFX.good();const cc=centerOf(c);sparkle(cc.x,cc.y,12);r++;ctx.fill(r);
          try{await say(q.ok);await wait(400)}catch(e){return}
          if(r<Q.length)round();else ronda();
        }else{ctx.err(q.why);flash(c,'wiggle',460)}
      });
    });
    say(q.q+' Toca tu respuesta.');
  }
  function ronda(){
    $$('.choice',play).forEach(c=>c.remove());
    const C={x:590,y:320},RX=250,RY=140;
    const spots=[-90,-30,30,90,150,210].map(a=>({x:C.x+Math.cos(a*Math.PI/180)*RX,y:C.y+Math.sin(a*Math.PI/180)*RY,taken:false}));
    const cushion=['#FF8FB1','#FFC94D','#5EC6FF','#E2574C','#7A6CFF','#FFB02E'];
    spots.forEach((s,k)=>play.appendChild(place(el(`<div class="abs" style="width:120px;height:40px;margin:-20px 0 0 -60px;border-radius:50%;background:${cushion[k]};box-shadow:0 6px 0 rgba(0,0,0,.15)"></div>`),s.x,s.y)));
    const seat=(node,s,w,h)=>{s.taken=true;place(node,s.x-w/2,s.y-h+12)};
    const sitters=[[lumiSVG({mood:'happy'}),0],[lumiSVG({mood:'happy',color:'#FF9EC4',acc:['lazo']}),2],[lumiSVG({mood:'happy',color:'#8EE3B5',acc:['hoja']}),4]];
    sitters.forEach(([svg,k])=>{const n=el(`<div class="abs friend" style="width:110px">${svg}</div>`);play.appendChild(n);seat(n,spots[k],110,94)});
    const wait3=[{svg:saltarinSVG(),w:92,h:132,y:140},{svg:lumiSVG({mood:'happy',color:'#C7B8FF',front:['lentes']}),w:110,h:94,y:320},{svg:lumiSVG({mood:'happy',color:'#FFD84D'}),w:76,h:65,y:470}];
    let placed=0;
    wait3.forEach(f=>{
      const n=place(el(`<div class="abs friend" style="width:${f.w}px;height:${f.h}px">${f.svg}</div>`),1090,f.y);play.appendChild(n);
      makeDraggable(n,{onDrop:p=>{
        const s=spots.filter(s=>!s.taken).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
        if(!s||Math.hypot(s.x-p.x,s.y-p.y)>120)return false;
        n.classList.add('returning');seat(n,s,f.w,f.h);n.dataset.locked='1';placed++;SFX.pop();sparkle(s.x,s.y-50,8);floatText(s.x,s.y-90,'¡Bienvenido!');

          later(()=>sparkle(C.x,C.y,24),300);
          say('¡Ahora todos están en la ronda! Ser diferentes nos hace especiales.');ctx.win(4200);
        }
        return true}});
    });
    say('¡Hagamos una ronda! Arrastra a cada amigo hasta un cojín para que nadie se quede fuera.');
  }
  round();
}

    const c=place(el(`<button class="choice" style="width:250px;height:280px"><div class="pic" style="height:170px">${pic}</div><div style="font-size:34px">${label}</div></button>`),715+n*280,190);

      ac();

      SFX.tap();go(levelScreen,i);

  scr.appendChild(place(el(`<div class="abs float" style="width:76px;pointer-events:none">${lumiSVG({mood:'happy'})}</div>`),lx+70,ly-40));

  later(()=>say(msg),350);
}

/* ---------- Pantalla de un nivel ---------- */
const RIGHT_ICON={shield:ICON.shieldS,smile:ICON.smile,amigos:ICON_AMIGOS,balance:ICON_BALANCE,moonI:ICON.moonI,zzz:ICON.zzz};
function levelScreen(scr,i){
  const L=LEVELS[i];
  scr.innerHTML=`<div class="abs play" style="inset:0"></div>
  <div class="hud"><button class="ibtn" id="bHome" aria-label="Volver al mapa">${ICON.home}</button>

  const play=$('.play',scr);
  const ctx={i,L,scr,play,errors:0,done:false,
    err(msg){ctx.errors++;SFX.oops();if(msg)say(msg)},
    meter(total,icon,blue){const m=$('#meter',scr);m.style.visibility='visible';m.classList.toggle('blue',!!blue);m.innerHTML=`<span class="mi">${icon}</span><span class="segs">${'<b></b>'.repeat(total)}</span>`},
    fill(n){$$('#meter .segs b',scr).forEach((b,k)=>b.classList.toggle('on',k<n))},

  };

  play.innerHTML=L.bg();
  const m=modal(`<div style="font-family:var(--display);font-size:30px;color:#7A6CFF">Nivel ${i+1}</div>
    <div class="row" style="gap:30px;flex-wrap:nowrap;margin:8px 0 6px">
      <div style="width:170px;height:170px;flex:none;display:grid;place-items:center;background:#fff;border-radius:50%;box-shadow:0 6px 0 #EADBC0">${LVICON[i].replace('class="ico"','style="width:120px;height:120px"')}</div>
      <div style="text-align:left;max-width:560px"><h2 style="font-size:54px">${L.title}</h2><span class="chip derecho" style="font-size:24px">${RIGHT_ICON[L.ico]}${L.right}</span><p style="margin-top:14px">${L.intro}</p></div>
    </div>
    <div class="row" style="margin-top:18px"><button class="btn papel sm" id="lRep">${ICON.speaker} Escuchar</button><button class="btn verde" id="lGo">${ICON.play} ¡A jugar!</button></div>`);
  later(()=>voice(L.intro),300);
  $('#lRep',m).addEventListener('click',()=>voice(L.intro));
  $('#lGo',m).addEventListener('click',()=>{ac();SFX.tap();stopSpeech();closeModal();L.build(ctx)});
}
function winLevel(i,errors){
  const L=LEVELS[i];const th=L.th||[0,2];const st=errors<=th[0]?3:errors<=th[1]?2:1;
  const LAST=LEVELS.length-1;G.stars[i]=Math.max(G.stars[i],st);G.unlocked=Math.max(G.unlocked,Math.min(LEVELS.length,i+2));
  if(!G.poses.includes(i))G.poses.push(i);if(!G.stickers.includes(i))G.stickers.push(i);if(i===LAST)G.done=true;save();
  const m=modal(`<h2>${pick(['¡Lo lograste!','¡Excelente trabajo!','¡Muy bien hecho!'])}</h2>
    <div class="stars3">${[0,1,2].map(()=>`<span class="s">${ICON.star}</span>`).join('')}</div>
    <div class="row">
      <div class="reward"><div class="pic">${poseSVG(i)}</div><b>Nueva postura</b><span>${POSES[i].name}</span></div>
      <div class="reward"><div class="pic">${STICKERS[i].svg.replace('<svg','<svg width="110" height="110"')}</div><b>Nuevo sticker</b><span>${STICKERS[i].name}</span></div>
    </div>
    <div class="lesson">${L.lesson}</div>
    <div class="row"><button class="btn papel sm" id="wMap">${ICON.home} Mapa</button><button class="btn papel sm" id="wAgain">${ICON.replay} Otra vez</button><button class="btn verde" id="wNext">${i<LAST?`Siguiente ${ICON.next}`:`${ICON.medal} ¡Mi medalla!`}</button></div>`,'win');
  SFX.win();sparkle(640,200,16);
  $$('.stars3 .s',m).forEach((s,k)=>{if(k<st)later(()=>{s.classList.add('on');SFX.star(k);const c=centerOf(s);sparkle(c.x,c.y,8)},600+k*420)});
  later(()=>voice(`¡Muy bien! Ganaste ${st} ${st===1?'estrella':'estrellas'}. ${L.lesson}`),500);
  $('#wMap',m).addEventListener('click',()=>{SFX.tap();go(mapScreen)});
  $('#wAgain',m).addEventListener('click',()=>{SFX.tap();go(levelScreen,i)});
  $('#wNext',m).addEventListener('click',()=>{SFX.tap();if(i<LAST)go(levelScreen,i+1);else go(finalScreen)});
}

  const slot=i=>({x:290+i*150,y:598});
  STICKERS.forEach((s,i)=>{
    const has=G.stickers.includes(i);
    const node=el(`<div class="abs" style="width:100px;height:100px">${s.svg}</div>`);
    const p=G.placed[i]||slot(i);place(node,p.x,p.y);
    if(!has){node.style.opacity='.22';node.style.filter='grayscale(1)';scr.appendChild(node);return}
    node.style.filter='drop-shadow(0 6px 4px rgba(0,0,0,.25))';scr.appendChild(node);
    makeDraggable(node,{onStart:()=>{SFX.tap()},onDrop:(pt)=>{
      if(pt.y>580){const sl=slot(i);node.classList.add('returning');place(node,sl.x,sl.y);delete G.placed[i];save();return true}
      const x=Math.max(10,Math.min(1160,parseFloat(node.style.left))),y=Math.max(110,Math.min(470,parseFloat(node.style.top)));
      node.classList.add('returning');place(node,x,y);G.placed[i]={x,y};save();SFX.pop();sparkle(x+50,y+50,6);return true}});
  });
  $('#bBack',scr).addEventListener('click',()=>{SFX.tap();go(mapScreen)});
  later(()=>say(G.stickers.length?'Arrastra tus stickers para decorar la cabaña de Lumi.':'Gana niveles para conseguir stickers y decorar la cabaña.'),300);
}

/* ---------- Pantalla final ---------- */
function finalScreen(scr){
  const RIGHTS=[['shield','Jugar seguro'],['smile','Divertirse y aprender'],['amigos','Todos juegan'],['balance','Escuchar al cuerpo'],['moonI','Rutina para dormir'],['zzz','Dormir bien']];
  const ic=RIGHT_ICON;
  scr.innerHTML=`${bgMeadow()}<canvas class="bg" id="conf" width="1280" height="720"></canvas>
  <div class="abs" style="left:0;right:0;top:22px;text-align:center">
    <div style="font-family:var(--display);font-weight:800;font-size:58px;color:#FFE08A;-webkit-text-stroke:13px var(--noche);paint-order:stroke fill;line-height:1.05">¡Ya eres parte de los<br>Guardianes del Valle!</div>
  </div>
  <div class="abs pulse" style="left:565px;top:168px;width:150px">${ICON.medal.replace('<svg','<svg width="150" height="150"')}</div>
  <div class="abs float" style="left:250px;top:170px;width:180px">${lumiSVG({mood:'happy',acc:['gorro']})}</div>
  <div class="abs bob" style="left:400px;top:150px;width:110px;animation-delay:-.5s">${saltarinSVG()}</div>
  <div class="abs bob" style="left:840px;top:160px;width:160px">${owlSVG()}</div>
  <div class="abs" style="left:150px;right:150px;top:345px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
    ${RIGHTS.map(([k,t])=>`<span class="chip" style="font-size:23px;padding:8px 18px 10px">${ic[k]}${t}</span>`).join('')}
  </div>
  <div class="abs" style="left:0;right:0;top:500px;display:flex;justify-content:center"><div class="counter" style="font-size:34px">${ICON.star}<span>${totalStars()} de ${MAXSTARS()} estrellas</span></div></div>
  <div class="abs" style="left:0;right:0;top:600px;display:flex;justify-content:center;gap:20px"><button class="btn papel sm" id="fMap">${ICON.home} Mapa</button><button class="btn verde sm" id="fAgain">${ICON.replay} Jugar de nuevo</button></div>`;
  hideNarr();
  SFX.win();
  const cv=$('#conf',scr),cx=cv.getContext('2d');const cols=['#FFC94D','#FF8FB1','#5EC6FF','#6CC07A','#7A6CFF','#fff'];
  const P=Array.from({length:130},()=>({x:rand(0,1280),y:rand(-720,0),vy:rand(60,150),vx:rand(-30,30),r:rand(0,6.28),vr:rand(-4,4),c:pick(cols),s:rand(8,16)}));
  loop(dt=>{cx.clearRect(0,0,1280,720);P.forEach(p=>{p.y+=p.vy*dt;p.x+=p.vx*dt;p.r+=p.vr*dt;if(p.y>740){p.y=-20;p.x=rand(0,1280)}cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()})});
  later(()=>speak('¡Felicidades! Cuidaste a Lumi en todo el valle. Recuerda: tienes derecho a jugar y a descansar. Juega en lugares seguros, juega con todos, escucha a tu cuerpo y duerme bien. ¡Eres un gran guardián!'),500);
  $('#fMap',scr).addEventListener('click',()=>{SFX.tap();go(mapScreen)});
  $('#fAgain',scr).addEventListener('click',()=>{SFX.tap();resetProgress();go(mapScreen)});
}

/* ---------- Panel para docentes ---------- */
function teacherPanel(){
  const m=modal(`<h2 style="font-size:38px">Opciones para docentes</h2>
    <div class="row" style="margin:6px 0 10px;gap:14px">
      <button class="btn papel sm" id="tVoice">${G.voice?ICON.speaker:ICON.mute} Voz: ${G.voice?'sí':'no'}</button>
      <button class="btn papel sm" id="tSound">${G.sound?ICON.speaker:ICON.mute} Sonidos: ${G.sound?'sí':'no'}</button>
    </div>
    <table style="font-size:18px;border-collapse:collapse;margin:0 auto 14px;text-align:left">
      <tr><th style="padding:2px 12px"></th><th style="padding:2px 12px">Nivel</th><th style="padding:2px 12px">Lo que aprende</th><th style="padding:2px 12px">Habilidad</th></tr>
      ${LEVELS.map((L,i)=>`<tr style="border-top:2px solid #EADBC0"><td style="padding:2px 12px;font-family:var(--display)">${i+1}</td><td style="padding:2px 12px">${L.title}</td><td style="padding:2px 12px;color:#C2416E;font-weight:700">${L.right}</td><td style="padding:2px 12px">${L.skill}</td></tr>`).join('')}
    </table>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;justify-items:stretch">
      <button class="btn sm" id="tUnlock" style="justify-content:center">Abrir todos los niveles</button>
      <button class="btn papel sm" id="tIntro" style="justify-content:center">Ver personajes</button>
      <button class="btn papel sm" id="tReset" style="justify-content:center">Borrar progreso</button>
      <button class="btn verde sm" id="tClose" style="justify-content:center">${ICON.check} Listo</button>
    </div>`);
  $('#tVoice',m).addEventListener('click',()=>{G.voice=!G.voice;save();if(!G.voice)stopSpeech();teacherPanel()});
  $('#tSound',m).addEventListener('click',()=>{G.sound=!G.sound;save();teacherPanel()});
  $('#tUnlock',m).addEventListener('click',()=>{G.unlocked=LEVELS.length;save();closeModal();go(mapScreen)});
  $('#tIntro',m).addEventListener('click',()=>{closeModal();go(introScreen)});
  const r=$('#tReset',m);r.addEventListener('click',()=>{if(r.dataset.sure){resetProgress();closeModal();go(mapScreen)}else{r.dataset.sure='1';r.textContent='¿Seguro? Toca otra vez';r.style.background='#FF8FB1'}});
  $('#tClose',m).addEventListener('click',()=>{SFX.tap();closeModal()});
}

/* ============ ARRANQUE ============ */
function start(data){
  if(data&&Array.isArray(data.stars)){G=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),data);fixStars()}else loadSaved();
  document.body.insertAdjacentHTML('afterbegin',GLOBAL_DEFS);
  stage.appendChild(narr);makeGrain();
  const rh=el(`<div id="rotHint" class="rot-hint">${ICON.rotate}<div>Gira tu teléfono para ver el juego más grande</div><button class="btn sm">Jugar así</button></div>`);
  document.body.appendChild(rh);rh.querySelector('button').addEventListener('click',()=>{rh.dataset.dismissed='1';rh.classList.remove('show')});
  fit();
  try{window.claude?.hot?.snapshot?.(()=>G)}catch(e){}
  go(splash);
}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});

</script>
